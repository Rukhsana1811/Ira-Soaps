<article class="card-ira ira-product-card">
  <div class="ira-product-card__media">
    <img [src]="product.img" [alt]="product.name" class="ira-product-card__image w-100" />
  </div>

  <div class="ira-product-card__body">
    <span class="eyebrow">{{ product.tagline }}</span>
    <h3>{{ product.name }}</h3>
    <p>{{ product.description }}</p>

    <ul class="ira-product-card__ingredients">
      <li *ngFor="let ing of product.ingredients.slice(0, 3)">{{ ing }}</li>
    </ul>

    <div class="ira-product-card__footer">
      <div class="ira-product-card__price">
        <strong>&#8377;{{ product.price }}</strong>
        <span>{{ product.size }}</span>
      </div>
      <div class="ira-product-card__quantity" aria-label="Quantity">
        <button type="button" aria-label="Decrease quantity" (click)="decrease()"><i class="bi bi-dash"></i></button>
        <span>{{ quantity }}</span>
        <button type="button" aria-label="Increase quantity" (click)="increase()"><i class="bi bi-plus"></i></button>
      </div>
      <div class="ira-product-card__actions">
        <button type="button" class="btn-ira-outline" (click)="addToCart()">
          <i class="bi bi-cart-plus"></i> Add to cart
        </button>
        <button type="button" class="btn-ira-primary" (click)="checkoutProduct()">
          <i class="bi bi-bag-check"></i> Buy now
        </button>
      </div>
    </div>
  </div>
</article>
