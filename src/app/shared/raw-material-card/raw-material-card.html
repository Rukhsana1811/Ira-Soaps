<article class="card-ira raw-material-card">
  <img [src]="material.img" [alt]="material.name" class="raw-material-card__image w-100" />
  <div class="raw-material-card__body">
    <span class="eyebrow">{{ material.tagline }}</span>
    <h3>{{ material.name }}</h3>
    <p>{{ material.description }}</p>
    <div class="raw-material-card__footer">
      <div class="raw-material-card__price">
        <strong>₹{{ material.price }}</strong>
        <span>{{ material.size }}</span>
      </div>
      <div class="raw-material-card__quantity" aria-label="Quantity">
        <button type="button" aria-label="Decrease quantity" (click)="decrease()"><i class="bi bi-dash"></i></button>
        <span>{{ quantity }}</span>
        <button type="button" aria-label="Increase quantity" (click)="increase()"><i class="bi bi-plus"></i></button>
      </div>
      <div class="raw-material-card__actions">
        <button type="button" class="btn-ira-outline" (click)="addToCart()"><i class="bi bi-cart-plus"></i> Add to cart</button>
        <button type="button" class="btn-ira-primary" (click)="buyNow()"><i class="bi bi-bag-check"></i> Buy now</button>
      </div>
    </div>
  </div>
</article>
